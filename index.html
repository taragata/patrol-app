<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#1f3a5f"><title>પેટ્રોલિંગ ચેક નોંધ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1b2430;--mut:#667085;--line:#d9dde3;--pri:#1f3a5f;--onpri:#fff;--acc:#b97a0b;--bad:#b42318;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151c;--card:#18202a;--ink:#e8ecf1;--mut:#9aa6b5;--line:#2a3441;--pri:#7fa6d9;--onpri:#10151c;--acc:#e0a53a;--bad:#f0746a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10151c;--card:#18202a;--ink:#e8ecf1;--mut:#9aa6b5;--line:#2a3441;--pri:#7fa6d9;--onpri:#10151c;--acc:#e0a53a;--bad:#f0746a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans Gujarati",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:0}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sub{color:var(--mut);font-size:.85rem}
button{font:inherit;border:0;border-radius:8px;padding:11px 16px;background:var(--pri);color:var(--onpri);font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--pri);border:1px solid var(--line)}
button.bad{background:transparent;color:var(--bad);border:1px solid var(--line)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
input,select,textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
label{display:block;font-size:.88rem;font-weight:600;margin:12px 0 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;display:flex;gap:12px}
.card img,.ph{width:64px;height:78px;object-fit:cover;border-radius:6px;background:var(--line);flex:none}
.card h3{margin:0;font-size:1rem}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.small{font-size:.85rem;color:var(--mut)}
.hide{display:none}
.bar{display:flex;gap:8px;margin-bottom:12px}
.bar input{flex:1}
.pv{max-width:140px;border-radius:8px;margin-top:8px;display:block}
.note{border-left:4px solid var(--acc);padding:6px 10px;margin:12px 0;font-size:.85rem;color:var(--mut)}
a{color:var(--pri);font-weight:600}
</style>
</head>
<body>
<main>
<section id="lock" class="hide">
  <h1>પેટ્રોલિંગ ચેક નોંધ</h1>
  <p class="sub" id="lockmsg">પ્રથમ વખત: 4 અંકનો PIN બનાવો.</p>
  <input id="pin" type="password" inputmode="numeric" maxlength="4" placeholder="4 અંકનો PIN" aria-label="PIN">
  <div class="row"><button id="pinbtn">ખોલો</button></div>
  <p class="small" id="pinerr" style="color:var(--bad)"></p>
</section>

<section id="list" class="hide">
  <header><div><h1>પેટ્રોલિંગ</h1><div class="sub" id="count"></div></div><button id="addbtn">+ નવી ચેકિંગ</button></header>
  <div class="bar"><input id="q" type="search" placeholder="નામ, મોબાઈલ કે સરનામું શોધો" aria-label="શોધ"></div>
  <div id="items"></div>
  <div class="row"><button class="ghost" id="exp">બેકઅપ ડાઉનલોડ</button><button class="ghost" id="lockbtn">લૉક કરો</button></div>
  <p class="note">આ નોંધ ફક્ત સત્તાવાર ફરજ માટે છે. માહિતી આ ફોનના બ્રાઉઝરમાં જ સંગ્રહાય છે. ફોન ખોવાય તો જોખમ રહે છે, તેથી ફોન પર સ્ક્રીન લૉક રાખો.</p>
</section>

<section id="form" class="hide">
  <header><h1>નવી ચેકિંગ</h1><button class="ghost" id="back">પાછા</button></header>
  <div class="note" style="margin-top:0">તારીખ અને સમય (ફોન મુજબ): <b id="now"></b></div>
  <label for="name">નામ</label><input id="name" autocomplete="off">
  <label for="mob">મોબાઈલ નંબર</label><input id="mob" inputmode="tel" maxlength="14" autocomplete="off">
  <label for="idt">ઓળખ પુરાવો</label>
  <select id="idt"><option>આધાર કાર્ડ</option><option>ચૂંટણી કાર્ડ</option><option>ડ્રાઇવિંગ લાઇસન્સ</option><option>પાન કાર્ડ</option><option>અન્ય</option><option>પુરાવો નથી</option></select>
  <label for="idn">ઓળખ નંબર</label><input id="idn" autocomplete="off">
  <label for="adr">રહેઠાણનું સરનામું</label><textarea id="adr" rows="2"></textarea>
  <label for="vt">સાથે વાહન</label>
  <select id="vt"><option value="">વાહન નથી</option><option>બાઇક / સ્કૂટર</option><option>રિક્ષા</option><option>કાર</option><option>ટ્રક / ટેમ્પો</option><option>અન્ય</option></select>
  <label for="vn">વાહન નંબર</label><input id="vn" autocapitalize="characters" autocomplete="off">
  <label for="vr">વાહનની વિગત (રંગ, મોડેલ)</label><input id="vr" autocomplete="off">
  <label for="ph">ફોટો</label>
  <input id="ph" type="file" accept="image/*" capture="environment">
  <img id="pv" class="pv hide" alt="પસંદ કરેલો ફોટો">
  <label>ચેક કર્યાનું સ્થળ</label>
  <div class="row" style="margin-top:0"><button class="ghost" id="gps">ફરી લોકેશન લો</button></div>
  <div class="small" id="locinfo">લોકેશન લીધું નથી</div>
  <label for="plc">સ્થળનું નામ (હાથથી લખો)</label><input id="plc" placeholder="દા.ત. બસ સ્ટેન્ડ પાસે">
  <label for="rem">નોંધ / કારણ</label><textarea id="rem" rows="2"></textarea>
  <div class="row"><button id="save">સાચવો</button></div>
  <p class="small" id="ferr" style="color:var(--bad)"></p>
</section>
</main>
<script>
(function(){
var K="patrol_v1",P="patrol_pin_v1",data=[],pic="",loc=null,t0=new Date();
var $=function(i){return document.getElementById(i)};
function ld(k){try{return localStorage.getItem(k)}catch(e){return null}}
function sv(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
function show(id){["lock","list","form"].forEach(function(s){$(s).classList.toggle("hide",s!==id)})}
function esc(s){return String(s||"").replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function load(){try{data=JSON.parse(ld(K)||"[]")}catch(e){data=[]}}
function hash(s){var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return String(h)}
var first=!ld(P);
$("lockmsg").textContent=first?"પ્રથમ વખત: 4 અંકનો PIN બનાવો.":"PIN દાખલ કરો.";
$("pinbtn").onclick=function(){
  var v=$("pin").value;
  if(!/^\d{4}$/.test(v)){$("pinerr").textContent="4 અંકનો PIN લખો.";return}
  if(first){sv(P,hash(v));first=false}
  else if(ld(P)!==hash(v)){$("pinerr").textContent="PIN ખોટો છે.";return}
  $("pin").value="";$("pinerr").textContent="";load();render();show("list");
};
$("lockbtn").onclick=function(){show("lock")};
function render(){
  var q=$("q").value.trim().toLowerCase();
  var rows=data.filter(function(d){return !q||[d.name,d.mob,d.adr,d.plc,d.vn].join(" ").toLowerCase().indexOf(q)>-1});
  $("count").textContent="કુલ નોંધ: "+data.length;
  $("items").innerHTML=rows.length?rows.map(function(d){
    var map=d.lat?'<a href="https://www.google.com/maps?q='+d.lat+','+d.lng+'" target="_blank" rel="noopener">નકશામાં જુઓ</a>':"";
    return '<div class="card">'+(d.pic?'<img src="'+d.pic+'" alt="">':'<div class="ph"></div>')+
    '<div style="min-width:0"><h3>'+esc(d.name||"નામ નથી")+'</h3>'+
    '<div class="small">'+esc(d.mob)+' · '+esc(d.idt)+' '+esc(d.idn)+'</div>'+
    '<div class="small">સરનામું: '+esc(d.adr)+'</div>'+
    '<div class="small">ચેકિંગ સ્થળ: '+esc(d.plc)+' '+map+'</div>'+
    (d.vt||d.vn?'<div class="small">વાહન: '+esc(d.vt)+' '+esc(d.vn)+' '+esc(d.vr)+'</div>':'')+'<div class="small">'+esc(d.when)+'</div>'+(d.rem?'<div class="small">નોંધ: '+esc(d.rem)+'</div>':"")+
    '<div class="row"><button class="bad" data-del="'+d.id+'">કાઢી નાખો</button></div></div></div>';
  }).join(""):'<p class="small">હજી કોઈ નોંધ નથી. "+ નવી ચેકિંગ" દબાવો.</p>';
}
$("q").oninput=render;
$("items").onclick=function(e){
  var id=e.target.getAttribute("data-del");
  if(id&&confirm("આ નોંધ કાઢી નાખવી છે?")){data=data.filter(function(d){return String(d.id)!==id});sv(K,JSON.stringify(data));render()}
};
$("addbtn").onclick=function(){
  ["name","mob","idn","adr","plc","rem","vn","vr"].forEach(function(i){$(i).value=""});
  pic="";loc=null;$("pv").classList.add("hide");$("ph").value="";$("locinfo").textContent="લોકેશન લીધું નથી";$("vt").value="";$("ferr").textContent="";t0=new Date();$("now").textContent=t0.toLocaleString("gu-IN");show("form");getLoc();
};
$("back").onclick=function(){show("list")};
$("ph").onchange=function(){
  var f=this.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){var im=new Image();im.onload=function(){
    var s=Math.min(1,480/Math.max(im.width,im.height)),c=document.createElement("canvas");
    c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    pic=c.toDataURL("image/jpeg",.7);$("pv").src=pic;$("pv").classList.remove("hide")};im.src=r.result};
  r.readAsDataURL(f);
};
function getLoc(){
  $("locinfo").textContent="લોકેશન મેળવી રહ્યા છીએ...";
  if(!navigator.geolocation){$("locinfo").textContent="આ ફોનમાં લોકેશન ઉપલબ્ધ નથી. સ્થળ હાથથી લખો.";return}
  navigator.geolocation.getCurrentPosition(function(p){
    loc={lat:p.coords.latitude.toFixed(6),lng:p.coords.longitude.toFixed(6)};
    $("locinfo").innerHTML='લોકેશન મળ્યું: '+loc.lat+', '+loc.lng+' · <a href="https://www.google.com/maps?q='+loc.lat+','+loc.lng+'" target="_blank" rel="noopener">નકશામાં જુઓ</a>';
  },function(){$("locinfo").textContent="લોકેશન મળ્યું નથી. પરવાનગી તપાસો અથવા સ્થળ હાથથી લખો."},{enableHighAccuracy:true,timeout:15000});
}
$("gps").onclick=getLoc;
$("save").onclick=function(){
  if(!$("name").value.trim()&&!$("mob").value.trim()){$("ferr").textContent="ઓછામાં ઓછું નામ અથવા મોબાઈલ નંબર લખો.";return}
  var d={id:Date.now(),name:$("name").value.trim(),mob:$("mob").value.trim(),idt:$("idt").value,idn:$("idn").value.trim(),adr:$("adr").value.trim(),plc:$("plc").value.trim(),vt:$("vt").value,vn:$("vn").value.trim().toUpperCase(),vr:$("vr").value.trim(),rem:$("rem").value.trim(),pic:pic,lat:loc&&loc.lat,lng:loc&&loc.lng,when:t0.toLocaleString("gu-IN")};
  data.unshift(d);
  if(!sv(K,JSON.stringify(data))){data.shift();$("ferr").textContent="સ્ટોરેજ ભરાઈ ગયું છે. જૂની નોંધનો બેકઅપ લઈ કાઢી નાખો.";return}
  render();show("list");
};
$("exp").onclick=function(){
  var t=data.map(function(d){return d.when+" | "+d.name+" | "+d.mob+" | "+d.idt+" "+d.idn+" | "+d.adr+" | "+d.plc+" | "+(d.vt||"")+" "+(d.vn||"")+" "+(d.vr||"")+" | "+(d.lat?d.lat+","+d.lng:"")+" | "+d.rem}).join("\n");
  var a=document.createElement("a");a.href="data:text/plain;charset=utf-8,"+encodeURIComponent(t);a.download="patrol-backup.txt";a.click();
};
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){})}
show("lock");
})();
</script>
</body>
</html>
